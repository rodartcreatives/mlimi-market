<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mlimi Market — Sell your produce. Find your market.</title>
<meta name="description" content="Mlimi Market connects farmers with produce to sell and buyers looking to buy, across Malawi's districts.">
<meta name="theme-color" content="#123329">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/shared.css">

<style>
  /* Page-specific styles for the home screen only */
  .home-hero {
    padding: var(--space-10) 0 var(--space-5);
  }
  .home-hero__greeting {
    color: var(--color-green-600);
    margin-bottom: var(--space-2);
  }
  .home-hero h1 {
    font-size: 34px;
    letter-spacing: -0.01em;
    margin-bottom: var(--space-2);
  }
  .home-hero__tagline {
    color: var(--color-ink-soft);
    font-size: 15px;
    max-width: 32ch;
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: var(--color-white);
    border: 1.5px solid var(--color-line);
    border-radius: var(--radius-md);
    padding: 0 var(--space-3);
    margin: var(--space-4) 0;
    min-height: var(--tap-min);
  }
  .search-bar input {
    border: none;
    flex: 1;
    min-height: var(--tap-min);
    padding: 0;
  }
  .search-bar input:focus { outline: none; }
  .search-bar .icon-wrap { color: var(--color-ink-soft); display: flex; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
  }

  .section-heading {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: var(--space-3);
  }
  .section-heading a {
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .section-eyebrow {
    display: block;
    margin-bottom: var(--space-2);
  }

  section + section { margin-top: var(--space-8); }
</style>
</head>
<body>

<div class="page">

  <header class="home-hero">
    <p class="eyebrow home-hero__greeting fade-in-up" id="homeGreeting" style="animation-delay:0ms;"></p>
    <h1 class="font-display fade-in-up" style="animation-delay:60ms;">Mlimi Market</h1>
    <p class="home-hero__tagline fade-in-up" style="animation-delay:120ms;">Sell your produce. Find your market.</p>
  </header>

  <form class="search-bar" id="homeSearchForm" role="search">
    <span class="icon-wrap" id="homeSearchIcon"></span>
    <input
      type="search"
      id="homeSearchInput"
      placeholder="What are you looking for?"
      aria-label="Search produce"
    >
  </form>

  <div class="action-row">
    <a href="sell.html" class="btn btn-primary"><span id="sellActionIcon"></span>Sell Produce</a>
    <a href="market.html" class="btn btn-secondary"><span id="findActionIcon"></span>Find Produce</a>
  </div>

  <section aria-labelledby="categoriesHeading">
    <span class="eyebrow section-eyebrow" id="categoryCountLabel"></span>
    <h2 id="categoriesHeading" class="mb-4">Browse by category</h2>
    <div class="category-strip" id="categoryStrip"></div>
  </section>

  <section aria-labelledby="freshHeading">
    <div class="section-heading">
      <div>
        <span class="eyebrow section-eyebrow">Newest first</span>
        <h2 id="freshHeading">Fresh Listings</h2>
      </div>
      <a href="market.html">See all<span id="freshSeeAllIcon"></span></a>
    </div>
    <div id="freshListings"></div>
  </section>

</div>

<!-- Firebase (compat SDK — plain global objects, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/icons.js"></script>
<script src="js/categories.js"></script>
<script src="js/firestore-helpers.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/nav.js"></script>

<script>
  // Icons that live in static markup above, filled in after icons.js loads
  document.getElementById("homeSearchIcon").innerHTML = icon("search", 18);
  document.getElementById("freshSeeAllIcon").innerHTML = icon("chevronRight", 14);
  document.getElementById("sellActionIcon").innerHTML = icon("plus", 18);
  document.getElementById("findActionIcon").innerHTML = icon("market", 18);

  // Time-of-day greeting — no auth/profile lookup on purpose. This is the
  // public landing page and most visits are signed out; pulling in the
  // auth SDK just to say someone's name here isn't worth the extra load.
  function getGreeting() {
    const hour = new Date().getHours();
    if (hour < 12) return "Good morning";
    if (hour < 17) return "Good afternoon";
    return "Good evening";
  }
  document.getElementById("homeGreeting").textContent = getGreeting();
  document.getElementById("categoryCountLabel").textContent = `${CATEGORIES.length} categories`;

  function renderCategoryStrip() {
    const el = document.getElementById("categoryStrip");
    el.innerHTML = CATEGORIES.map((cat) => `
      <a href="market.html?category=${cat.slug}" class="category-chip">
        <span class="category-chip__icon">${icon(cat.icon, 24)}</span>
        <span class="category-chip__label">${cat.name}</span>
      </a>
    `).join("");
  }

  async function loadFreshListings() {
    const container = document.getElementById("freshListings");
    renderSkeletonGrid(container);
    try {
      const items = await getListings({ sort: "newest" });
      const fresh = items.slice(0, 6);

      if (!fresh.length) {
        renderState(container, "empty", {
          title: "No produce listed yet",
          message: "Be the first to list your produce on Mlimi Market.",
        });
        return;
      }

      container.innerHTML = `<div class="listing-grid">${
        fresh.map((l, i) => listingCardHTML(l, {
          extraClass: "fade-in-up",
          style: `animation-delay:${Math.min(i, 8) * 40}ms`,
        })).join("")
      }</div>`;
    } catch (err) {
      console.error("Failed to load fresh listings:", err);
      renderState(container, "error", {
        title: "We couldn't load the market",
        message: "Check your connection and try again.",
        retryLabel: "Retry",
        onRetry: loadFreshListings,
      });
    }
  }

  document.getElementById("homeSearchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("homeSearchInput").value.trim();
    window.location.href = q ? `market.html?q=${encodeURIComponent(q)}` : "market.html";
  });

  renderCategoryStrip();
  loadFreshListings();
  renderBottomNav("home");
</script>

</body>
</html>
